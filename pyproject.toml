[tool.ruff]
# Максимальная длина строки (стандарт PEP8 - 88 или 100)
line-length = 100
# Укажите вашу версию Python, например, py310, py311 или py312
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Разрешаем вызовы функций FastAPI в аргументах по умолчанию (исправляет ошибку B008)
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body"
]
